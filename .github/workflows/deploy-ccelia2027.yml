name: Deploy Ccelia2027 Worker (manual)

on:
  workflow_dispatch:
    inputs:
      free_tier_verified:
        description: "I verified Workers Free is active with no billing profile or payment method."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ccelia2027-production
  cancel-in-progress: false

jobs:
  deploy:
    name: verify and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check deployment safety gates
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CF_FREE_TIER_INPUT: ${{ inputs.free_tier_verified }}
          CF_FREE_TIER_VARIABLE: ${{ vars.CLOUDFLARE_FREE_TIER_VERIFIED }}
        run: |
          failures=0
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run this workflow from main only."; failures=1; }
          [[ "$CF_FREE_TIER_INPUT" == "true" ]] || { echo "::error::Confirm Workers Free with no billing before deployment."; failures=1; }
          [[ "$CF_FREE_TIER_VARIABLE" == "true" ]] || { echo "::error::Set repository variable CLOUDFLARE_FREE_TIER_VERIFIED=true only after confirming no billing."; failures=1; }
          [[ -n "$CF_API_TOKEN" ]] || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."; failures=1; }
          [[ -n "$CF_ACCOUNT_ID" ]] || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID."; failures=1; }
          [[ -n "$APP_ACCESS_PASSWORD" ]] || { echo "::error::Missing repository secret APP_ACCESS_PASSWORD."; failures=1; }
          [[ ${#SESSION_SECRET} -ge 32 ]] || { echo "::error::SESSION_SECRET must contain at least 32 characters."; failures=1; }
          exit "$failures"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccelia2027/package-lock.json

      - name: Install Worker dependencies
        run: npm ci
        working-directory: ccelia2027

      - name: Run Worker tests
        run: npm test
        working-directory: ccelia2027

      - name: Lint and build Worker
        run: |
          npm run lint
          npm run build
        working-directory: ccelia2027

      - name: Deploy Worker and store application secrets
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ccelia2027
          secrets: |
            APP_ACCESS_PASSWORD
            SESSION_SECRET
        env:
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
