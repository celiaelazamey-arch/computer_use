name: CELA Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cela-monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: verify local planner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: bash ./cela.sh test
      # Contract guard: fails when a public name, signature, CLI flag, exit code,
      # memory backend, or Worker route changed without a reviewed snapshot update.
      - run: python tools/api_surface.py --check
      - run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/cela-sh-wheels" .

  verify-containers:
    name: verify API container (no models)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose --profile api --profile memory config --quiet
      - name: Build the installed runtime image
        run: docker build --target runtime --tag cela-sh-api:ci .
      - name: Exercise native vec0 as the unprivileged runtime user
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume cela-api-ci-data:/app/data cela-sh-api:ci python -c '
          import os
          from types import SimpleNamespace
          from cela_sh import SqliteVecMemoryStore
          assert os.getuid() == 10001
          store = SqliteVecMemoryStore("/app/data/smoke.db", SimpleNamespace(embed=lambda text: [1.0, 0.0]))
          assert store.add_memory("ci-session", "native vec0 smoke test")
          result = store.search_memory("query", "ci-session")[0]
          assert result["content"] == "native vec0 smoke test" and result["score"] == 1.0
          assert store.search_memory("query", "other-session") == []
          '
      - name: Check API startup and liveness without Ollama
        run: |
          docker run -d --name cela-sh-api-ci --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume cela-api-ci-data:/app/data \
            --publish 127.0.0.1:8000:8000 cela-sh-api:ci
          curl --fail --silent --show-error --retry 12 --retry-delay 1 \
            --retry-connrefused --max-time 5 http://127.0.0.1:8000/health | \
            python -c 'import json, sys; h = json.load(sys.stdin); assert h["status"] == "ok" and h["memory_backend"] == "sqlite-vec" and h["dry_run"] is True and h["execution_enabled"] is False'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs cela-sh-api-ci || true
          docker rm -f cela-sh-api-ci || true

  verify:
    name: verify Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ccelia2027
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccelia2027/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Keep this list identical to prettier_check_root_docs in ../cela.sh so the
      # local gate and CI cannot drift apart.
      - run: |
          npm exec -- prettier --check \
            ../README.md \
            ../CHANGELOG.md \
            ../CONTRIBUTING.md \
            ../SECURITY.md \
            ../docs/*.md \
            ../.github/dependabot.yml \
            ../.github/workflows/*.yml \
            ../.github/PULL_REQUEST_TEMPLATE.md \
            ../.github/ISSUE_TEMPLATE/*.yml \
            ../.github/ISSUE_TEMPLATE/*.md \
            ../CCELIA2027-DEPLOYMENT.md
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccelia2027-worker-build
          path: ccelia2027/dist/
          if-no-files-found: error
          retention-days: 7
