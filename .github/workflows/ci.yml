name: CELA Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cela-monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: verify local planner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: bash ./cela.sh test
      - run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/cela-sh-wheels" .

  verify:
    name: verify Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ccelia2027
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccelia2027/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: |
          npm exec -- prettier --check \
            ../README.md \
            ../CHANGELOG.md \
            ../docs/system-architecture.md \
            ../.github/dependabot.yml \
            ../.github/workflows/*.yml \
            ../CCELIA2027-DEPLOYMENT.md
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccelia2027-worker-build
          path: ccelia2027/dist/
          if-no-files-found: error
          retention-days: 7
