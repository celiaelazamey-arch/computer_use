[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cela-sh"
version = "1.0.2"
description = "A local-first, dry-run-only planning system backed by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "requests>=2.32,<3",
  "sqlite-vec==0.1.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
documents = ["pypdf>=5,<7"]
dev = [
  "pytest>=7.4,<10",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
"cela.sh" = "cela_sh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cela_sh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
