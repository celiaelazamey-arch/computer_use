[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cela-sh"
version = "1.0.0"
description = "A local-first, dry-run-only planning system backed by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
"cela.sh" = "cela_sh.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cela_sh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
