name: Cloudflare Worker Deploy

on:
  workflow_dispatch:
    inputs:
      free_tier_verified:
        description: "I verified Workers Free is active and there is no payment method or paid plan."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  preflight:
    name: check deployment secrets
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        name: Check required secret names without exposing values
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CF_FREE_TIER_VERIFIED: ${{ inputs.free_tier_verified }}
        run: |
          if [[ "$CF_FREE_TIER_VERIFIED" == "true" && -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" && -n "$APP_ACCESS_PASSWORD" && ${#SESSION_SECRET} -ge 32 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BLOCKED - verify Workers Free and configure all required secrets before deployment."
          fi

  deploy:
    name: deploy Worker
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Store private application secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf '%s' "$APP_ACCESS_PASSWORD" | npx wrangler secret put APP_ACCESS_PASSWORD
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
