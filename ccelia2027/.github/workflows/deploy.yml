name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: deploy Worker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: Confirm deployment preconditions
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CF_FREE_TIER_VERIFIED: ${{ vars.CLOUDFLARE_FREE_TIER_VERIFIED }}
        run: |
          missing=0
          [[ -n "$CF_API_TOKEN" ]] || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN."; missing=1; }
          [[ -n "$CF_ACCOUNT_ID" ]] || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID."; missing=1; }
          [[ -n "$APP_ACCESS_PASSWORD" ]] || { echo "::error::Missing repository secret APP_ACCESS_PASSWORD."; missing=1; }
          [[ ${#SESSION_SECRET} -ge 32 ]] || { echo "::error::Missing repository secret SESSION_SECRET (needs 32+ characters)."; missing=1; }
          [[ "$CF_FREE_TIER_VERIFIED" == "true" ]] || { echo "::error::Set repository variable CLOUDFLARE_FREE_TIER_VERIFIED=true after confirming Workers Free with no billing profile or payment method."; missing=1; }
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APP_ACCESS_PASSWORD
            SESSION_SECRET
        env:
          APP_ACCESS_PASSWORD: ${{ secrets.APP_ACCESS_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      - name: Show deployment URL
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Deployment URL: $DEPLOYMENT_URL"
          else
            echo "Deployment URL unavailable"
          fi
